name: Build Plugin

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-2022

    steps:
      - name: Checkout Plugin Repository
        uses: actions/checkout@v4

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          arch: 'win64_msvc2019_64'

      - name: Cache OBS Studio Build
        id: cache-obs
        uses: actions/cache@v4
        with:
          path: |
            D:/obs-src/build
            D:/obs-src/.deps
          key: obs-studio-core-32.2.2-deps2026-v4-x64

      - name: Setup OBS Source & Dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "D:/obs-src" -Force
          Set-Location "D:/obs-src"
          if (-not (Test-Path "D:/obs-src/CMakeLists.txt")) {
            git init
            git remote add origin https://github.com/obsproject/obs-studio.git
            git fetch --depth 1 origin 32.2.2
            git checkout -f FETCH_HEAD
          }
          
          if (-not (Test-Path "D:/obs-src/.deps/obs-deps-2026-08-26-x64")) {
            $depsUrl = "https://github.com/obsproject/obs-deps/releases/download/2026-08-26/windows-deps-2026-08-26-x64.zip"
            Invoke-WebRequest -Uri $depsUrl -OutFile deps.zip
            Expand-Archive deps.zip -DestinationPath "D:/obs-src/.deps/obs-deps-2026-08-26-x64"
          }

      - name: Build Minimal OBS Core (if not cached)
        if: steps.cache-obs.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-Location "D:/obs-src"
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DENABLE_PLUGINS=OFF `
            -DENABLE_SCRIPTING=OFF `
            -DENABLE_BROWSER=OFF `
            -DCMAKE_PREFIX_PATH="D:/obs-src/.deps/obs-deps-2026-08-26-x64;${env:Qt6_DIR}"
          
          cmake --build build --config Release --target libobs obs-frontend-api --parallel

      - name: Configure Mix Track Filter Plugin
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DOBS_PATH="D:/obs-src/build" `
            -DCMAKE_MODULE_PATH="D:/obs-src/cmake/finders" `
            -DCMAKE_PREFIX_PATH="D:/obs-src/.deps/obs-deps-2026-08-26-x64;${env:Qt6_DIR}" `
            -DQT_DIR="${env:Qt6_DIR}"

      - name: Build Plugin
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Package Plugin (mix-track-filter/bin/64bit/)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "package/mix-track-filter/bin/64bit" -Force
          Copy-Item -Path "build/Release/mix-track-filter.dll" -Destination "package/mix-track-filter/bin/64bit/"
          $ver = (Get-Content "CMakeLists.txt" | Select-String 'VERSION\s+([0-9\.]+)').Matches.Groups[1].Value
          $artifactBase = "mix-track-filter-windows-$ver"
          $zipName = "$artifactBase.zip"
          Compress-Archive -Path "package/mix-track-filter" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          echo "ARTIFACT_NAME=$artifactBase" >> $env:GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

